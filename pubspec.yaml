name: flsqliteviewer
description: "FlSQLite Viewer - A cross-platform SQLite database viewer and editor"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqlite3: ^2.7.6
  sqlite3_flutter_libs: ^0.5.33
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  path: ^1.9.1
  shared_preferences: ^2.3.5
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.4
  build_runner: ^2.4.14

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
